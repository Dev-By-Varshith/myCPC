name: Nightly Analysis Cron

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-nightly-jobs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package.json

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scikit-learn numpy pandas

    - name: Install Node dependencies
      run: |
        cd backend
        npm install

    - name: Run Elo Mastery Decay (Node.js)
      run: |
        cd backend
        node -e "require('./elo_engine.js').applyMasteryDecay()"
      env:
        DATABASE_PATH: ./antigravity.db # In prod, this would point to Supabase

    - name: Run Archetype Clustering (Python)
      run: |
        cd engine
        # In a real environment, you'd fetch all active user handles. 
        # Here we run a sample trigger for 'varshith'
        python clustering.py varshith
