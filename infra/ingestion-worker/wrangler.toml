name = "mycpc-ingest"
main = "src/index.js"
compatibility_date = "2024-02-08"

# Bind your R2 bucket to the worker.
# In production, create the bucket: wrangler r2 bucket create mycpc-traces
[[r2_buckets]]
binding = "TRACES_BUCKET"
bucket_name = "mycpc-traces"

[vars]
# You will set the JWT secret securely in production using:
# wrangler secret put JWT_SECRET
JWT_SECRET = "dev-secret-key-change-in-prod"
